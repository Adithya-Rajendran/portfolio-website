<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- this file is also the shell of every generated page (tools/site.py), which live in folders: all paths are from the root -->
<base href="/">
<title>Arcadia Station</title>
<!--site:head-->
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="post.css">
<!-- before anything is painted: an article's own URL starts as a readable page ("reading"), everything else as the station (post.css) -->
<script>document.documentElement.className = /^\/(blog|portfolio)\/[^/]+\/?$/.test(location.pathname) ? 'reading' : 'station';</script>
<!-- three.js r181 as published, minified (1.3 MB less to load); three.module.js next to it is the same code, readable -->
<script type="importmap">
{ "imports": { "three": "./vendor/three.module.min.js", "three/addons/": "./vendor/jsm/" } }
</script>
</head>
<body>
<canvas id="scene"></canvas>
<noscript><p style="position:fixed;left:0;right:0;bottom:0;padding:18px 22px;font:14px/1.6 sans-serif;color:#a9c0cd;background:#04060a">Arcadia Station is drawn in 3D and needs JavaScript. Everything it says can be read without it: <a href="/about/" style="color:#7fe3ff">about</a>, <a href="/portfolio/" style="color:#7fe3ff">projects</a>, <a href="/experience/" style="color:#7fe3ff">experience</a>, <a href="/blog/" style="color:#7fe3ff">writing</a>, <a href="/contact/" style="color:#7fe3ff">contact</a>.</p></noscript>
<!-- the way around for a page read as a page (post.css); the station has its own display -->
<nav id="pagenav" aria-label="Site"><a href="/">ARK AURORA</a><a href="/about/">ABOUT</a><a href="/portfolio/">PROJECTS</a><a href="/experience/">EXPERIENCE</a><a href="/blog/">WRITING</a><a href="/contact/">CONTACT</a></nav>
<!--site:page-->

<!-- Everything below is filled in from content.json by main.js: one page, and a room per entry in "rooms". -->
<div id="loader">
  <div class="mark">◯</div>
  <div class="bar"><i id="progress"></i></div>
  <div class="label"><span id="what"></span> <span class="percentage"><span id="pct">0</span>%</span></div>
</div>

<div id="hud" class="hidden">
  <header>
    <div class="brand"><span class="ring"></span><span id="brand"></span></div>
    <nav></nav>
  </header>
  <section class="hero">
    <p class="kicker"></p>
    <p class="headline" role="heading" aria-level="1"></p>
    <p class="sub"></p>
  </section>
  <footer></footer>
</div>
<!-- what the display has noticed under the pointer (js/hud.js): marks around it, what it is, what a click does -->
<div id="lock" aria-hidden="true" hidden><div class="lock-box"><i class="c tl"></i><i class="c tr"></i><i class="c bl"></i><i class="c br"></i></div><div class="lock-tag"><span class="lock-name"></span><span class="lock-verb"></span></div></div>

<div id="inspectbar" hidden>
  <span id="named" aria-live="polite"></span><button id="back">←  BACK</button><button id="prev" aria-label="Previous">‹</button><span id="count"></span><button id="next" aria-label="Next">›</button><span id="ways"></span>
</div>
<script type="module" src="main.js"></script>
</body>
</html>
