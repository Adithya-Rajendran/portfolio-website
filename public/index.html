<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Arcadia Station</title>
<link rel="stylesheet" href="style.css">
<script type="importmap">
{ "imports": { "three": "./vendor/three.module.js", "three/addons/": "./vendor/jsm/" } }
</script>
</head>
<body>
<canvas id="scene"></canvas>

<!-- Everything below is filled in from content.json by main.js: one page, and a room per entry in "rooms". -->
<div id="loader">
  <div class="mark">◯</div>
  <div class="bar"><i id="progress"></i></div>
  <div class="label"><span id="what"></span> <span id="pct">0</span>%</div>
</div>

<div id="hud" class="hidden">
  <header>
    <div class="brand"><span class="ring"></span><span id="brand"></span></div>
    <nav></nav>
  </header>
  <section class="hero">
    <p class="kicker"></p>
    <h1></h1>
    <p class="sub"></p>
  </section>
  <footer></footer>
</div>

<div id="inspectbar" hidden>
  <button id="back">←  BACK</button><button id="prev" aria-label="Previous">‹</button><span id="count"></span><button id="next" aria-label="Next">›</button><span id="ways"></span>
</div>
<script type="module" src="main.js"></script>
</body>
</html>
