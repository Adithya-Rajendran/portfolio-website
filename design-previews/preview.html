<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Serif+Display:ital@0;1&family=IBM+Plex+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600;700&display=swap');
#ar-designs{--ar-blue:#2448ed;--ar-lime:#d4fa73;--ar-green:#205743;font-family:'DM Sans',sans-serif;color:#171c23;text-align:left;width:100%;font-size:16px;line-height:1.6}
#ar-designs *{box-sizing:border-box}
#ar-designs [hidden]{display:none!important}
#ar-designs button,#ar-designs a{-webkit-tap-highlight-color:transparent}
#ar-designs button{font:inherit;cursor:pointer}
#ar-designs a{color:inherit;text-decoration:none}
#ar-designs button:focus-visible,#ar-designs a:focus-visible{outline:3px solid #6a86ff;outline-offset:4px}
#ar-designs h1,#ar-designs h2,#ar-designs h3,#ar-designs p,#ar-designs figure{margin:0}
#ar-designs .ar-chooser{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
#ar-designs .ar-choice{padding:14px 17px;border:1px solid light-dark(#d8dce2,#3b3e43);background:light-dark(#fff,#202227);color:light-dark(#20232a,#f2f3f5);text-align:left;border-radius:10px;line-height:1.3;display:flex;gap:12px;align-items:center}
#ar-designs .ar-choice[aria-pressed=true]{border-color:#4669ec;box-shadow:inset 0 0 0 1px #4669ec}
#ar-designs .ar-choice strong{display:block;font-size:14px;font-weight:600}
#ar-designs .ar-choice small{font-size:12px;opacity:.7;display:block;margin-top:4px}
#ar-designs .ar-swatch{width:28px;height:32px;flex:none;border-radius:4px;border:1px solid #c6c9cf;background:linear-gradient(90deg,#f6f7fa 65%,#2448ed 65%)}
#ar-designs .ar-choice:nth-child(2) .ar-swatch{background:linear-gradient(90deg,#171b1e 65%,#d4fa73 65%);border-color:#353b3b}
#ar-designs .ar-choice:nth-child(3) .ar-swatch{background:linear-gradient(90deg,#fff 65%,#205743 65%)}
#ar-designs .ar-site{overflow:hidden;border:1px solid #dce0e5;isolation:isolate;min-height:800px}
#ar-designs .ar-mono{font-family:'IBM Plex Mono',monospace;font-size:12px;line-height:1.6;font-weight:400;letter-spacing:.035em}
#ar-designs .ar-arrow{font-family:Arial,sans-serif;font-weight:400}
#ar-designs .ar-nav{display:flex;align-items:center;gap:25px}
#ar-designs .ar-nav button{background:none;border:0;color:inherit;padding:8px 0;font-size:13px;line-height:1.5}
#ar-designs .ar-nav button[aria-current=page]{text-decoration:underline;text-underline-offset:6px;text-decoration-thickness:2px}
#ar-designs .ar-nav a{font-size:13px}
#ar-designs .ar-pill{display:inline-block;padding:5px 10px;border:1px solid currentColor;border-radius:30px;font-size:11px;line-height:1.4}
#ar-designs .ar-link{display:inline-flex;align-items:center;gap:28px;font-size:14px;font-weight:500;border:0;background:none;padding:0;color:inherit}
#ar-designs .ar-link .ar-arrow{font-size:20px}
#ar-designs .ar-section-label{display:flex;justify-content:space-between;gap:20px;align-items:baseline}
#ar-designs .ar-section-label h2{font-size:25px;font-weight:500;letter-spacing:-.7px;line-height:1.3}
#ar-designs .ar-intro{font-size:15px;line-height:1.8;max-width:530px}
#ar-designs .ar-brand{border:0;background:none;display:flex;align-items:center;gap:10px;font-size:13px;line-height:1.3;font-weight:500;color:inherit;padding:0}
#ar-designs .ar-brand-mark{width:30px;height:30px;display:grid;place-items:center;font-size:16px;font-family:'DM Serif Display',Georgia,serif;letter-spacing:-1.5px}
#ar-designs .ar-footer{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;font-size:12px;padding-top:24px;margin-top:55px;border-top:1px solid #dce0e5;color:#637080}
#ar-designs .ar-footer-links{display:flex;gap:20px}
#ar-designs .ar-article{display:block;transition:transform .2s}
#ar-designs .ar-article:hover{transform:translateY(-3px)}
#ar-designs .ar-article h3{font-weight:500;font-size:23px;line-height:1.25;letter-spacing:-.6px}
#ar-designs .ar-article p{font-size:13px;line-height:1.7;margin-top:13px}
#ar-designs .ar-article-meta{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.02em}
/* 01 — Editorial Journal */
#ar-designs .ar-editorial{background:#f6f7f9;color:#152238;padding:0 48px 26px}
#ar-designs .ar-editorial .ar-header{padding:23px 0;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #cad0db;gap:20px}
#ar-designs .ar-editorial .ar-brand-mark{background:var(--ar-blue);color:#fff}
#ar-designs .ar-editorial .ar-brand span:last-child{max-width:160px}
#ar-designs .ar-editorial .ar-nav button[aria-current=page]{color:var(--ar-blue)}
#ar-designs .ar-ed-hero{display:grid;grid-template-columns:1.7fr 1fr;gap:32px;padding:51px 0 45px;align-items:start}
#ar-designs .ar-ed-eyebrow{display:flex;gap:10px;align-items:center;color:var(--ar-blue);margin-bottom:22px}
#ar-designs .ar-ed-eyebrow:before{content:'';width:26px;height:1px;background:var(--ar-blue)}
#ar-designs .ar-ed-name{font-family:'DM Serif Display',Georgia,serif;font-size:clamp(54px,7.4vw,86px);font-weight:400;letter-spacing:-3.6px;line-height:1.02}
#ar-designs .ar-ed-name em{color:var(--ar-blue);font-weight:400}
#ar-designs .ar-ed-role{margin-top:25px;font-size:16px;font-weight:500;letter-spacing:-.3px}
#ar-designs .ar-ed-role span{border-bottom:1px solid #8997b5}
#ar-designs .ar-ed-copy{margin-top:13px;color:#536174;font-size:14px;line-height:1.8;max-width:380px}
#ar-designs .ar-ed-actions{margin-top:24px;display:flex;gap:24px;align-items:center}
#ar-designs .ar-ed-actions button:first-child{background:var(--ar-blue);color:#fff;padding:11px 17px}
#ar-designs .ar-ed-portrait{position:relative;padding:11px 0 0 12px;margin-top:10px}
#ar-designs .ar-ed-portrait:before{content:'';position:absolute;inset:0 12px 38px 0;border:1px solid #a7b9f7;z-index:-1}
#ar-designs .ar-ed-portrait img{width:100%;aspect-ratio:4/4.55;object-fit:cover;display:block;filter:grayscale(100%);background:#d6d9dd}
#ar-designs .ar-ed-portrait figcaption{display:flex;justify-content:space-between;font-size:10px;color:#58677b;padding-top:11px}
#ar-designs .ar-ed-stack{display:flex;gap:19px;padding:14px 0;border-top:1px solid #cad0db;border-bottom:1px solid #cad0db;flex-wrap:wrap;color:#546176}
#ar-designs .ar-ed-stack span:first-child{color:#243c64;margin-right:auto}
#ar-designs .ar-ed-writing{padding-top:34px}
#ar-designs .ar-ed-writing .ar-section-label h2{font-family:'DM Serif Display',Georgia,serif;font-size:32px;font-weight:400}
#ar-designs .ar-ed-writing .ar-section-label button{font-size:12px;color:var(--ar-blue)}
#ar-designs .ar-ed-articles{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;margin-top:24px}
#ar-designs .ar-ed-articles .ar-article{border-top:2px solid #bec7d6;padding-top:12px}
#ar-designs .ar-ed-articles .ar-article-meta{color:#66768c}
#ar-designs .ar-ed-articles h3{font-family:'DM Serif Display',Georgia,serif;font-size:23px;font-weight:400;margin-top:12px}
#ar-designs .ar-ed-articles p{color:#58677b}
#ar-designs .ar-ed-articles .ar-read{display:block;margin-top:15px;font-size:12px;color:var(--ar-blue)}
/* 02 — Systems Studio */
#ar-designs .ar-systems{background:#15191b;color:#f3f5f1;padding:0 42px 25px;border-color:#343a3c}
#ar-designs .ar-systems .ar-header{display:flex;justify-content:space-between;align-items:center;gap:20px;padding:22px 0;border-bottom:1px solid #363c3e}
#ar-designs .ar-systems .ar-brand{font-family:'Space Grotesk',sans-serif;font-size:16px;font-weight:600}
#ar-designs .ar-systems .ar-brand-mark{border:1px solid #677650;color:var(--ar-lime);font-family:'IBM Plex Mono',monospace;font-size:14px;letter-spacing:-1px}
#ar-designs .ar-systems .ar-nav{color:#b9c0be}
#ar-designs .ar-systems .ar-nav button[aria-current=page]{color:var(--ar-lime)}
#ar-designs .ar-sys-hero{padding-top:31px}
#ar-designs .ar-sys-caption{display:flex;justify-content:space-between;color:#b3bcb7;font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.06em}
#ar-designs .ar-sys-name{font-family:'Space Grotesk',sans-serif;font-size:clamp(50px,8.1vw,93px);font-weight:500;letter-spacing:-6px;line-height:1.06;margin-top:29px}
#ar-designs .ar-sys-name span{color:var(--ar-lime)}
#ar-designs .ar-sys-mid{display:grid;grid-template-columns:1.15fr 1fr;gap:42px;align-items:start;padding:31px 0 35px}
#ar-designs .ar-sys-mid p{font-size:14px;color:#aeb7b3;line-height:1.8}
#ar-designs .ar-sys-mid p strong{color:#f3f5f1;font-weight:400}
#ar-designs .ar-sys-mid .ar-link{background:var(--ar-lime);color:#172015;padding:11px 18px;font-size:13px;margin-top:22px;gap:34px}
#ar-designs .ar-sys-identity{display:flex;align-items:center;gap:14px;margin-bottom:20px}
#ar-designs .ar-sys-identity img{height:49px;width:49px;object-fit:cover;filter:grayscale(100%);border-radius:50%}
#ar-designs .ar-sys-identity strong{font-size:14px;font-weight:500;display:block}
#ar-designs .ar-sys-identity span{font-size:12px;color:#b8c0ba;display:block;margin-top:3px}
#ar-designs .ar-sys-tools{border:1px solid #3c4344;padding:0 16px}
#ar-designs .ar-sys-tools div{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid #343b3c;font-family:'IBM Plex Mono',monospace;font-size:11px}
#ar-designs .ar-sys-tools div:last-child{border:0}
#ar-designs .ar-sys-tools span{color:#aeb9ae}
#ar-designs .ar-sys-tools strong{font-weight:400;color:#e7ece4}
#ar-designs .ar-sys-writing{border-top:1px solid #3c4344;padding-top:26px}
#ar-designs .ar-sys-writing .ar-section-label h2{font-family:'Space Grotesk',sans-serif;font-size:29px;font-weight:500}
#ar-designs .ar-sys-writing .ar-section-label button{color:var(--ar-lime);font-family:'IBM Plex Mono',monospace;font-size:11px}
#ar-designs .ar-sys-articles{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid #3c4344;margin-top:20px}
#ar-designs .ar-sys-articles .ar-article{padding:19px 17px;border-right:1px solid #3c4344}
#ar-designs .ar-sys-articles .ar-article:last-child{border-right:0}
#ar-designs .ar-sys-articles .ar-article:first-child{background:#222a21}
#ar-designs .ar-sys-articles .ar-article-meta{color:#a6b99b;font-size:10px}
#ar-designs .ar-sys-articles h3{font-family:'Space Grotesk',sans-serif;font-size:21px;margin-top:23px;letter-spacing:-.65px;line-height:1.35}
#ar-designs .ar-sys-articles p{font-size:12px;color:#aab6b0}
#ar-designs .ar-sys-articles .ar-read{display:flex;justify-content:space-between;margin-top:22px;color:var(--ar-lime);font-size:11px;font-family:'IBM Plex Mono',monospace}
#ar-designs .ar-systems .ar-footer{border-color:#3c4344;color:#a3aea8;margin-top:35px}
/* 03 — Minimal Portfolio */
#ar-designs .ar-minimal{background:#fff;color:#222a26;display:grid;grid-template-columns:210px 1fr;padding:45px 43px 29px;gap:48px}
#ar-designs .ar-min-sidebar{border-right:1px solid #e3e8e4;padding-right:30px;display:flex;flex-direction:column;align-items:flex-start}
#ar-designs .ar-min-sidebar img{width:69px;height:69px;border-radius:50%;object-fit:cover;margin-bottom:19px}
#ar-designs .ar-min-brand{font-size:19px;font-weight:500;letter-spacing:-.4px;line-height:1.3;border:0;background:none;color:#222a26;text-align:left;padding:0}
#ar-designs .ar-min-sidebar p{font-size:12px;color:#6b766f;line-height:1.8;margin-top:10px}
#ar-designs .ar-min-sidebar .ar-nav{display:flex;flex-direction:column;gap:11px;align-items:flex-start;margin-top:34px;width:100%}
#ar-designs .ar-min-sidebar .ar-nav button{font-size:13px;width:100%;text-align:left;padding:6px 0;color:#68756d}
#ar-designs .ar-min-sidebar .ar-nav button[aria-current=page]{text-decoration:none;color:var(--ar-green);font-weight:600;display:flex;justify-content:space-between}
#ar-designs .ar-min-sidebar .ar-nav button[aria-current=page]:after{content:'↗'}
#ar-designs .ar-min-sidebar .ar-nav a{padding:5px 0;color:#68756d}
#ar-designs .ar-min-social{display:flex;flex-direction:column;gap:10px;margin-top:55px;font-size:12px;color:#6b766f}
#ar-designs .ar-min-sidebar .ar-mono{margin-top:auto;padding-top:45px;color:#68756d;font-size:10px}
#ar-designs .ar-min-hero{padding:4px 0 32px}
#ar-designs .ar-min-kicker{font-size:12px;color:var(--ar-green);margin-bottom:18px}
#ar-designs .ar-min-title{font-family:'DM Serif Display',Georgia,serif;font-size:clamp(38px,4.8vw,56px);line-height:1.1;letter-spacing:-1.6px;font-weight:400}
#ar-designs .ar-min-title em{font-weight:400;color:var(--ar-green)}
#ar-designs .ar-min-hero .ar-intro{font-size:14px;color:#67756b;margin-top:23px;line-height:1.9;max-width:500px}
#ar-designs .ar-min-hero .ar-link{font-size:12px;color:var(--ar-green);margin-top:22px;gap:18px}
#ar-designs .ar-min-writing{padding-top:24px;border-top:1px solid #e3e8e4}
#ar-designs .ar-min-writing .ar-section-label h2{font-size:15px;font-weight:500;letter-spacing:0}
#ar-designs .ar-min-writing .ar-section-label button{font-size:11px;color:#6b766f;gap:10px}
#ar-designs .ar-min-articles{margin-top:7px}
#ar-designs .ar-min-articles .ar-article{display:grid;grid-template-columns:65px 1fr 15px;gap:15px;padding:23px 0;border-bottom:1px solid #e3e8e4;align-items:start}
#ar-designs .ar-min-articles .ar-article-meta{font-family:'DM Sans',sans-serif;font-size:11px;color:#68756d;margin-top:3px;line-height:1.5}
#ar-designs .ar-min-articles h3{font-size:16px;letter-spacing:-.25px;line-height:1.5;font-weight:500}
#ar-designs .ar-min-articles p{font-size:12px;color:#68756d;margin-top:7px;line-height:1.7}
#ar-designs .ar-min-articles .ar-arrow{font-size:18px;color:#677d70}
#ar-designs .ar-min-current{display:flex;justify-content:space-between;gap:20px;padding-top:23px;color:#66786c;font-size:12px}
#ar-designs .ar-min-current strong{display:block;color:#283b2e;font-weight:500;margin-top:7px;font-size:14px}
#ar-designs .ar-min-current>span{font-size:11px;text-align:right}
#ar-designs .ar-minimal .ar-footer{border:0;margin-top:34px;padding-top:0;color:#68756d;font-size:11px}
/* Shared secondary preview pages */
#ar-designs .ar-inner{padding:40px 0 10px;min-height:600px}
#ar-designs .ar-inner .ar-page-title{font-family:'DM Serif Display',Georgia,serif;font-size:55px;line-height:1.1;letter-spacing:-1.8px;font-weight:400;margin:15px 0 22px}
#ar-designs .ar-systems .ar-page-title{font-family:'Space Grotesk',sans-serif;color:var(--ar-lime)}
#ar-designs .ar-inner .ar-intro{opacity:.8;margin-bottom:30px}
#ar-designs .ar-about-copy{max-width:630px;font-size:15px;line-height:1.9}
#ar-designs .ar-about-copy p{margin-bottom:22px}
#ar-designs .ar-work-row{display:grid;grid-template-columns:150px 1fr;gap:30px;border-top:1px solid #84928a55;padding:24px 0}
#ar-designs .ar-work-row h3{font-size:21px;line-height:1.3;font-weight:500;letter-spacing:-.4px}
#ar-designs .ar-work-row p{font-size:14px;line-height:1.8;margin-top:9px;opacity:.7}
#ar-designs .ar-work-date{font-size:12px;opacity:.7;line-height:1.7}
#ar-designs .ar-work-skills{display:flex;gap:8px;flex-wrap:wrap;padding-top:18px}
#ar-designs .ar-page-intro{margin-bottom:30px}
#ar-designs .ar-enter{animation:ar-enter .3s ease-out}
@keyframes ar-enter{from{opacity:.5;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}
@media(prefers-reduced-motion:reduce){#ar-designs .ar-enter{animation:none}#ar-designs .ar-article{transition:none}}
@media(max-width:760px){
 #ar-designs .ar-editorial,#ar-designs .ar-systems{padding-left:27px;padding-right:27px}
 #ar-designs .ar-nav{gap:16px}
 #ar-designs .ar-ed-name{font-size:65px}
 #ar-designs .ar-ed-hero{grid-template-columns:1.5fr 1fr;gap:22px}
 #ar-designs .ar-ed-portrait{margin-top:34px}
 #ar-designs .ar-ed-portrait img{aspect-ratio:3/4.4}
 #ar-designs .ar-ed-stack{gap:12px}
 #ar-designs .ar-ed-articles{gap:15px}
 #ar-designs .ar-sys-name{font-size:68px;letter-spacing:-4px}
 #ar-designs .ar-sys-mid{gap:23px}
 #ar-designs .ar-minimal{grid-template-columns:160px 1fr;gap:28px;padding:32px 27px}
 #ar-designs .ar-min-sidebar{padding-right:18px}
 #ar-designs .ar-min-title{font-size:44px}
 #ar-designs .ar-min-articles .ar-article{grid-template-columns:1fr 15px;gap:8px}
 #ar-designs .ar-min-articles .ar-article-meta{grid-column:1/-1}
 #ar-designs .ar-choice{padding:12px 10px;gap:8px}
 #ar-designs .ar-choice small{display:none}
 #ar-designs .ar-choice strong{font-size:12px}
 #ar-designs .ar-swatch{width:21px;height:27px}
}
@media(max-width:540px){
 #ar-designs .ar-chooser{gap:5px}
 #ar-designs .ar-choice{padding:10px 7px;gap:6px;align-items:flex-start}
 #ar-designs .ar-choice strong{font-size:11px;line-height:1.4}
 #ar-designs .ar-swatch{width:12px;height:25px}
 #ar-designs .ar-editorial,#ar-designs .ar-systems{padding-left:20px;padding-right:20px}
 #ar-designs .ar-editorial .ar-header,#ar-designs .ar-systems .ar-header{flex-wrap:wrap;gap:16px;padding:18px 0}
 #ar-designs .ar-header .ar-nav{width:100%;justify-content:space-between;gap:12px}
 #ar-designs .ar-header .ar-nav button,#ar-designs .ar-header .ar-nav a{font-size:12px;padding:8px 0}
 #ar-designs .ar-ed-hero{grid-template-columns:1fr;padding:31px 0 27px;gap:25px}
 #ar-designs .ar-ed-name{font-size:67px;letter-spacing:-3px}
 #ar-designs .ar-ed-eyebrow{font-size:10px}
 #ar-designs .ar-ed-portrait{display:none}
 #ar-designs .ar-ed-role{font-size:14px}
 #ar-designs .ar-ed-copy{font-size:14px}
 #ar-designs .ar-ed-stack{font-size:10px;gap:13px}
 #ar-designs .ar-ed-stack span:first-child{width:100%}
 #ar-designs .ar-ed-writing .ar-section-label h2{font-size:27px}
 #ar-designs .ar-ed-articles{grid-template-columns:1fr;gap:26px}
 #ar-designs .ar-ed-articles h3{font-size:26px}
 #ar-designs .ar-ed-articles p{font-size:14px}
 #ar-designs .ar-section-label{gap:12px}
 #ar-designs .ar-section-label .ar-link{gap:8px;font-size:11px}
 #ar-designs .ar-sys-name{font-size:54px;letter-spacing:-3px}
 #ar-designs .ar-sys-caption{font-size:9px;gap:15px}
 #ar-designs .ar-sys-mid{grid-template-columns:1fr;gap:28px}
 #ar-designs .ar-sys-tools div{font-size:12px}
 #ar-designs .ar-sys-articles{grid-template-columns:1fr}
 #ar-designs .ar-sys-articles .ar-article{border-right:0;border-bottom:1px solid #3c4344;padding:22px}
 #ar-designs .ar-sys-articles .ar-article:last-child{border-bottom:0}
 #ar-designs .ar-sys-articles h3{font-size:25px;margin-top:15px}
 #ar-designs .ar-sys-articles p{font-size:14px}
 #ar-designs .ar-minimal{display:block;padding:25px 22px}
 #ar-designs .ar-min-sidebar{border-right:0;border-bottom:1px solid #e3e8e4;padding:0 0 20px;display:grid;grid-template-columns:48px 1fr;column-gap:13px;align-items:center}
 #ar-designs .ar-min-sidebar img{width:48px;height:48px;margin:0;grid-row:1/3}
 #ar-designs .ar-min-brand{font-size:17px;align-self:end}
 #ar-designs .ar-min-brand br{display:none}
 #ar-designs .ar-min-sidebar p{font-size:10px;margin-top:3px}
 #ar-designs .ar-min-sidebar p br{display:none}
 #ar-designs .ar-min-sidebar .ar-nav{grid-column:1/-1;flex-direction:row;gap:20px;margin-top:21px}
 #ar-designs .ar-min-sidebar .ar-nav button{font-size:12px;width:auto}
 #ar-designs .ar-min-sidebar .ar-nav button:after{display:none!important}
 #ar-designs .ar-min-sidebar .ar-nav a{font-size:12px}
 #ar-designs .ar-min-social,#ar-designs .ar-min-sidebar>.ar-mono{display:none}
 #ar-designs .ar-min-hero{padding-top:30px}

 const cards=()=>articles.map((a,i)=>`<a class="ar-article" href="https://adithya-rajendran.com/blog/${a.slug}" target="_blank" rel="noopener noreferrer" aria-label="Read ${a.title} on the current website (opens in a new tab)"><div class="ar-article-meta">${state.design==='minimal'?a.short+'<br>2026':state.design==='systems'?`0${i+1} / ${a.category}`:a.date+' · '+a.time.toUpperCase()}</div><div><h3>${a.title}</h3><p>${a.description}</p>${state.design==='minimal'?'':`<span class="ar-read">${state.design==='systems'?a.time.toUpperCase()+' READ':'Read the story'} ${arrow}</span>`}</div>${state.design==='minimal'?arrow:''}</a>`).join('');
 const writing=(name)=>`<section class="ar-${name}-writing"><div class="ar-section-label"><h2>${state.design==='systems'?'Notes from the field.':state.design==='minimal'?'Latest writing':'The field notes'}</h2>${action('All writing','writing')}</div><div class="ar-${name}-articles">${cards()}</div></section>`;
 const follow=()=>`<section class="ar-pub-follow" aria-label="Follow Adithya's writing"><div><h2>Keep the conversation going.</h2><p>Follow along on LinkedIn, or get new articles in your RSS reader.</p></div><div class="ar-pub-follow-links"><a href="https://www.linkedin.com/in/adithya-rajendran" target="_blank" rel="noopener noreferrer">Follow on LinkedIn ↗</a><a href="https://adithya-rajendran.com/feed.xml" target="_blank" rel="noopener noreferrer">RSS feed ↗</a></div></section>`;
 const publicationHome=()=>{
  const latest=articles[0];
  return `<section class="ar-pub-masthead"><div class="ar-mono">A NOTEBOOK BY ADITHYA RAJENDRAN</div><h1 class="ar-pub-title">Field <em>notes.</em></h1><p class="ar-pub-deck">Infrastructure, experiments, and the occasional detour. Writing down what I learn from building, breaking, and connecting things.</p></section><section class="ar-pub-feature" aria-label="Latest article"><div><a class="ar-pub-feature-main" href="https://adithya-rajendran.com/blog/${latest.slug}" target="_blank" rel="noopener noreferrer" aria-label="Read ${latest.title} on the current website (opens in a new tab)"><div class="ar-article-meta">LATEST ARTICLE / HOMELAB</div><h2>${latest.title}</h2></a><div class="ar-pub-byline"><img src="${portrait}" alt="" width="27" height="27"><span>Adithya Rajendran · Mar 30, 2026 · 7 min</span></div></div><div class="ar-pub-feature-side"><p>A view into my homelab and some notes on running a small dynamic cloud on three Raspberry Pis, three mini PCs, and an old Dell laptop.</p><a class="ar-link" href="https://adithya-rajendran.com/blog/${latest.slug}" target="_blank" rel="noopener noreferrer">Read the article ${arrow}</a></div></section><section class="ar-pub-section"><div class="ar-section-label"><h2>More from the notebook</h2>${action('Browse the archive','writing')}</div><div class="ar-pub-articles">${articles.slice(1).map(a=>`<a class="ar-article" href="https://adithya-rajendran.com/blog/${a.slug}" target="_blank" rel="noopener noreferrer" aria-label="Read ${a.title} on the current website (opens in a new tab)"><div class="ar-article-meta">${a.category} · ${a.date} · ${a.time.toUpperCase()}</div><h3>${a.title}</h3><p>${a.description}</p><span class="ar-read">Read the article ${arrow}</span></a>`).join('')}</div></section>${follow()}<section class="ar-pub-author" aria-label="About the author"><img src="${portrait}" alt="Adithya Rajendran" width="49" height="49"><p><strong>I'm Adithya.</strong> I work on infrastructure at Canonical and explore the interesting parts in my homelab. This is my notebook along the way. <button type="button" data-page="about">More about me</button></p></section>`;
 };
 const sidebar=()=>`<aside class="ar-min-sidebar"><img src="${portrait}" alt="Adithya Rajendran" width="69" height="69"><button type="button" class="ar-min-brand" data-page="home">Adithya<br> Rajendran</button><p>Notes on infrastructure<br>and whatever comes next.</p>${nav()}<div class="ar-min-social"><a href="https://github.com/Adithya-Rajendran" target="_blank" rel="noopener noreferrer">GitHub ↗</a><a href="https://www.linkedin.com/in/adithya-rajendran" target="_blank" rel="noopener noreferrer">LinkedIn ↗</a><a href="https://adithya-rajendran.com/feed.xml" target="_blank" rel="noopener noreferrer">RSS ↗</a></div><div class="ar-mono">REMOTE<br>UNITED STATES</div></aside>`;
 const about=()=>`<section class="ar-inner ar-enter"><div class="ar-mono">A LITTLE MORE ABOUT ME</div><h1 class="ar-page-title">Curiosity is the<br>common thread.</h1><div class="ar-about-copy"><p>I came to infrastructure through security. At UC Santa Cruz, the Slug Security Club gave me a place to learn about network security and ethical hacking outside the classroom. After graduating, I worked on cloud compliance, threat modeling, and automation before moving into field engineering at Canonical.</p><p>Today, I help design and deploy private-cloud systems built around Linux, OpenStack, Kubernetes, and Ceph. I like the point where a design stops being a diagram and has to survive real networks, real constraints, and real operators.</p><p>My homelab is where I rebuild systems from scratch, test recovery paths, and experiment with GPU and AI infrastructure. The blog is the notebook for that process: part runbook, part postmortem, and part record of whatever held my attention long enough to understand.</p><p>Outside the rack, I watch documentaries and keep a loose queue of experiments — including a Jetson-based ground robot and, someday, a drone.</p></div>${action('Explore my experience','work')}</section>`;
 const work=()=>`<section class="ar-inner ar-enter"><div class="ar-mono">EXPERIENCE / EDUCATION</div><h1 class="ar-page-title">Work that holds up<br>in the real world.</h1><p class="ar-intro">Architecture, troubleshooting, automation, and security hardening.</p><div class="ar-pub-work-intro"><a class="ar-link" href="https://adithya-rajendran.com/resume" target="_blank" rel="noopener noreferrer">View résumé ↗</a><a class="ar-link" href="https://www.linkedin.com/in/adithya-rajendran" target="_blank" rel="noopener noreferrer">Connect on LinkedIn ↗</a></div><div class="ar-work-row"><div class="ar-work-date">May 2024 — Present<br>Remote</div><div><h3>Field Software Engineer I</h3><p>Canonical Ltd (Ubuntu)</p><p>Designing and deploying private clouds built on OpenStack, Kubernetes, and Ceph. Automating with Python, Terraform, and Bash, and troubleshooting from the kernel to the network.</p></div></div><div class="ar-work-row"><div class="ar-work-date">Dec 2023 — May 2024<br>Fremont, CA</div><div><h3>Cybersecurity Analyst Intern</h3><p>Technical Consulting & Research, Inc.</p><p>Cloud compliance, threat modeling, security automation, and practical applications of authentication and access control.</p></div></div><div class="ar-work-row"><div class="ar-work-date">June 2023<br>Santa Cruz, CA</div><div><h3>B.Sc. Computer Science</h3><p>University of California, Santa Cruz</p></div></div><div class="ar-work-skills">${['Linux','OpenStack','Kubernetes','Ceph','Terraform','Python','Bash','Security'].map(s=>`<span class="ar-pill">${s}</span>`).join('')}</div></section>`;
 const writingPage=()=>`<section class="ar-inner ar-enter"><div class="ar-mono">THE ARCHIVE</div><h1 class="ar-page-title">All the field notes.</h1><p class="ar-intro">Technical notes, documentaries, things I'm learning, and the occasional detour. This is where I write about whatever has my attention.</p><div class="ar-${state.design==='editorial'?'ed':state.design==='systems'?'sys':'min'}-articles">${cards()}</div>${follow()}</section>`;
 function render(){
  root.style.setProperty('--ar-blue',state.accent);
  root.querySelectorAll('[data-design]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.design===state.design)));
  surface.className='ar-site ar-'+state.design;
  let content=state.page==='about'?about():state.page==='work'?work():state.page==='writing'?writingPage():publicationHome();
  surface.innerHTML=state.design==='minimal'?`${sidebar()}<div>${content}${footer()}</div>`:`${header()}<div class="ar-enter">${content}</div>${footer()}`;
 }
 root.addEventListener('click',event=>{
  const design=event.target.closest('[data-design]');
  const page=event.target.closest('[data-page]');
  if(design){state.design=design.dataset.design;render();root.querySelector('#ar-design-announcement').textContent=design.textContent.trim()+' preview selected';}
  if(page){state.page=page.dataset.page;render();const current=surface.querySelector('[aria-current=page]');if(current)current.focus({preventScroll:true});root.querySelector('#ar-design-announcement').textContent=state.page+' preview opened';}
 });
 render();
 if(globalThis.Tweak){const tweak=new Tweak({container:root,onChange:render});tweak.addColorPicker(state,'accent',{label:'Editorial accent',reference:'--ar-blue'});}
})();
</script>
