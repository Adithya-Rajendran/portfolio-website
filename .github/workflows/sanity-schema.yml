name: Sanity schema
permissions:
    contents: read

# After each merge to the production branch, `pnpm schema:deploy` registers the embedded
# Studio and deploys its schema, so the copy Sanity's dashboard and tools
# read matches the repository (CLAUDE.md, the Sanity schema paragraph). It
# runs in the Production environment (Settings → Environments), whose
# deployment branches are limited to protected branches. The active
# v2-rewrite branch is protected; feature branches cannot reach its secrets:
# SANITY_AUTH_TOKEN (a Sanity
# API token with the Deploy Studio role), SANITY_STUDIO_PROJECT_ID
# and SANITY_STUDIO_DATASET. A manual run is for the first
# deploy or a retry.
on:
    push:
        branches: ["v2-rewrite"]
    workflow_dispatch:

# One deploy at a time, in order: a queued run waits rather than cancels,
# so the latest production merge always deploys last.
concurrency:
    group: ${{ github.workflow }}
    cancel-in-progress: false

jobs:
    deploy:
        name: Deploy the schema
        runs-on: ubuntu-latest
        timeout-minutes: 10
        environment: Production
        # The two identifiers are public (every page's source has them) but
        # kept as environment secrets with the token; the log masks them.
        env:
            SANITY_STUDIO_PROJECT_ID: ${{ secrets.SANITY_STUDIO_PROJECT_ID }}
            SANITY_STUDIO_DATASET: ${{ secrets.SANITY_STUDIO_DATASET }}

        steps:
            - name: Check the environment's settings
              env:
                  SANITY_AUTH_TOKEN: ${{ secrets.SANITY_AUTH_TOKEN }}
              run: |
                  missing=""
                  [ -n "$SANITY_AUTH_TOKEN" ] || missing="$missing SANITY_AUTH_TOKEN"
                  [ -n "$SANITY_STUDIO_PROJECT_ID" ] || missing="$missing SANITY_STUDIO_PROJECT_ID"
                  [ -n "$SANITY_STUDIO_DATASET" ] || missing="$missing SANITY_STUDIO_DATASET"
                  if [ -n "$missing" ]; then
                      echo "::error title=Sanity schema not deployed::Add these secrets to the Production environment (Settings → Environments):$missing"
                      exit 1
                  fi
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  # Nothing here pushes, so the job keeps no GitHub token.
                  persist-credentials: false
            # pnpm version comes from package.json "packageManager".
            - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
            - name: Use Node.js 24.x
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: 24.x
                  cache: "pnpm"
            - run: pnpm install --frozen-lockfile
            # sanity deploy --external --schema-required: nothing is built or
            # uploaded. The application named in sanity.cli.ts gets the
            # schema, and so does the dataset copy; a schema failure fails
            # the job. The token is scoped to this step.
            - name: Register the Studio and deploy its schema
              env:
                  SANITY_AUTH_TOKEN: ${{ secrets.SANITY_AUTH_TOKEN }}
              run: pnpm schema:deploy --verbose
