name: Sanity schema
permissions:
    contents: read

# After each merge to main, `pnpm schema:deploy` registers the embedded
# Studio and deploys its schema, so the copy Sanity's dashboard and tools
# read matches the repository (CLAUDE.md, the Sanity schema paragraph). It
# needs three settings under Settings → Secrets and variables → Actions:
# the secret SANITY_AUTH_TOKEN (a Sanity API token with the Deploy Studio
# role) and the variables NEXT_PUBLIC_STORE_SANITY_PROJECT_ID and
# NEXT_PUBLIC_STORE_SANITY_DATASET. A manual run is for the first deploy
# or a retry.
on:
    push:
        branches: ["main"]
    workflow_dispatch:

# One deploy at a time, in order: a queued run waits rather than cancels,
# so the latest merge always deploys last.
concurrency:
    group: ${{ github.workflow }}
    cancel-in-progress: false

jobs:
    deploy:
        name: Deploy the schema
        runs-on: ubuntu-latest
        env:
            NEXT_PUBLIC_STORE_SANITY_PROJECT_ID: ${{ vars.NEXT_PUBLIC_STORE_SANITY_PROJECT_ID }}
            NEXT_PUBLIC_STORE_SANITY_DATASET: ${{ vars.NEXT_PUBLIC_STORE_SANITY_DATASET }}

        steps:
            - name: Check the repository settings
              env:
                  SANITY_AUTH_TOKEN: ${{ secrets.SANITY_AUTH_TOKEN }}
              run: |
                  missing=""
                  [ -n "$SANITY_AUTH_TOKEN" ] || missing="$missing SANITY_AUTH_TOKEN (secret)"
                  [ -n "$NEXT_PUBLIC_STORE_SANITY_PROJECT_ID" ] || missing="$missing NEXT_PUBLIC_STORE_SANITY_PROJECT_ID (variable)"
                  [ -n "$NEXT_PUBLIC_STORE_SANITY_DATASET" ] || missing="$missing NEXT_PUBLIC_STORE_SANITY_DATASET (variable)"
                  if [ -n "$missing" ]; then
                      echo "::error title=Sanity schema not deployed::Add these under Settings → Secrets and variables → Actions:$missing"
                      exit 1
                  fi
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            # pnpm version comes from package.json "packageManager".
            - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
            - name: Use Node.js 24.x
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: 24.x
                  cache: "pnpm"
            - run: pnpm install --frozen-lockfile
            # sanity deploy --external --schema-required: nothing is built or
            # uploaded. The application named in sanity.cli.ts gets the
            # schema, and so does the dataset copy; a schema failure fails
            # the job. The token is scoped to this step.
            - name: Register the Studio and deploy its schema
              env:
                  SANITY_AUTH_TOKEN: ${{ secrets.SANITY_AUTH_TOKEN }}
              run: pnpm schema:deploy --verbose
