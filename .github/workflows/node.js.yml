name: CI
permissions:
    contents: read

on:
    push:
        branches: ["main", "redesign", "redesign/**"]
    pull_request:
        branches: ["main", "redesign", "redesign/**"]
    # Monthly on main, so a dated check fails without a push: the smoke
    # spec's security.txt expiry, a month ahead of the date.
    schedule:
        - cron: "0 9 1 * *"

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
    lint:
        name: Lint, Type Check & Test
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            # pnpm version comes from package.json "packageManager".
            - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
            - name: Use Node.js 24.x
              uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
              with:
                  node-version: 24.x
                  cache: "pnpm"
            - run: pnpm install --frozen-lockfile
            - run: pnpm run lint
            - run: pnpm run typecheck
            - name: Check Sanity typegen is current
              env:
                  # "fallback" is the sentinel lib/sanity-config.ts treats as
                  # unconfigured: extract/typegen run offline against the
                  # schema definitions with zero network I/O.
                  NEXT_PUBLIC_STORE_SANITY_PROJECT_ID: fallback
              run: |
                  pnpm exec sanity schema extract --force
                  pnpm typegen
                  git diff --exit-code schema.json sanity.types.ts
            - run: pnpm run format:check
            - run: pnpm test

    build:
        # cacheComponents + reactCompiler surface cache/Suspense placement
        # errors at build time only — lint/typecheck cannot catch them.
        name: Build
        runs-on: ubuntu-latest
        env:
            # "fallback" is the sentinel lib/sanity-config.ts treats as
            # unconfigured: the Studio route can still prerender (valid
            # project-id format) while every data fetcher short-circuits
            # to empty content with zero network I/O during the build.
            NEXT_PUBLIC_STORE_SANITY_PROJECT_ID: fallback

        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            # pnpm version comes from package.json "packageManager".
            - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
            - name: Use Node.js 24.x
              uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
              with:
                  node-version: 24.x
                  cache: "pnpm"
            - run: pnpm install --frozen-lockfile
            - run: pnpm run build

    e2e:
        # Playwright against a fixture build (lib/fixtures.ts content, no
        # Sanity credentials): smoke, no-JS, axe, layout, the byte report and
        # review screenshots. playwright.config.ts builds and starts the
        # site itself.
        name: Browser tests
        runs-on: ubuntu-latest
        timeout-minutes: 30

        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            # pnpm version comes from package.json "packageManager".
            - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
            - name: Use Node.js 24.x
              uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
              with:
                  node-version: 24.x
                  cache: "pnpm"
            - run: pnpm install --frozen-lockfile
            - name: Install Chromium and its system libraries
              run: pnpm exec playwright install --with-deps chromium
            - run: pnpm test:e2e
            - name: Upload the report and screenshots
              if: ${{ !cancelled() }}
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: playwright-report-fixture
                  path: playwright-report/
                  retention-days: 14
