name: CI
permissions:
    contents: read

on:
    push:
        branches: ["main", "redesign", "redesign/**"]
    pull_request:
        branches: ["main", "redesign", "redesign/**"]

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
    lint:
        name: Lint, Type Check & Test
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v7
            # pnpm version comes from package.json "packageManager".
            - uses: pnpm/action-setup@v6
            - name: Use Node.js 24.x
              uses: actions/setup-node@v7
              with:
                  node-version: 24.x
                  cache: "pnpm"
            - run: pnpm install --frozen-lockfile
            - run: pnpm run lint
            - run: pnpm run typecheck
            - name: Check Sanity typegen is current
              env:
                  # "fallback" is the sentinel lib/sanity-config.ts treats as
                  # unconfigured: extract/typegen run offline against the
                  # schema definitions with zero network I/O.
                  NEXT_PUBLIC_STORE_SANITY_PROJECT_ID: fallback
              run: |
                  pnpm exec sanity schema extract --force
                  pnpm typegen
                  git diff --exit-code schema.json sanity.types.ts
            - run: pnpm run format:check
            - run: pnpm test

    build:
        # cacheComponents + reactCompiler surface cache/Suspense placement
        # errors at build time only — lint/typecheck cannot catch them.
        name: Build
        runs-on: ubuntu-latest
        env:
            # "fallback" is the sentinel lib/sanity-config.ts treats as
            # unconfigured: the Studio route can still prerender (valid
            # project-id format) while every data fetcher short-circuits
            # to empty content with zero network I/O during the build.
            NEXT_PUBLIC_STORE_SANITY_PROJECT_ID: fallback

        steps:
            - uses: actions/checkout@v7
            # pnpm version comes from package.json "packageManager".
            - uses: pnpm/action-setup@v6
            - name: Use Node.js 24.x
              uses: actions/setup-node@v7
              with:
                  node-version: 24.x
                  cache: "pnpm"
            - run: pnpm install --frozen-lockfile
            - run: pnpm run build

    e2e:
        # Playwright against a fixture build (lib/fixtures.ts content, no
        # Sanity credentials): smoke, no-JS, axe, layout, the byte report and
        # review screenshots. playwright.config.ts builds and starts the
        # site itself.
        name: Browser tests
        runs-on: ubuntu-latest
        timeout-minutes: 30

        steps:
            - uses: actions/checkout@v7
            # pnpm version comes from package.json "packageManager".
            - uses: pnpm/action-setup@v6
            - name: Use Node.js 24.x
              uses: actions/setup-node@v6
              with:
                  node-version: 24.x
                  cache: "pnpm"
            - run: pnpm install --frozen-lockfile
            - name: Install Chromium and its system libraries
              run: pnpm exec playwright install --with-deps chromium
            - run: pnpm test:e2e
            - name: Upload the report and screenshots
              if: ${{ !cancelled() }}
              uses: actions/upload-artifact@v7
              with:
                  name: playwright-report-fixture
                  path: playwright-report/
                  retention-days: 14
