name: CI
permissions:
    contents: read
on:
    push:
        branches: ["main", "v2-rewrite"]
    pull_request:

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
    verify:
        name: Checks and Worker build
        runs-on: ubuntu-latest
        env:
            SANITY_STUDIO_PROJECT_ID: fallback
            SANITY_STUDIO_DATASET: production
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: 24.x
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - run: pnpm lint
            - run: pnpm typecheck
            - name: Check generated Sanity types
              run: |
                  pnpm typegen
                  git diff --exit-code schema.json sanity.types.ts
            - run: pnpm format:check
            - run: pnpm test:coverage
            - run: pnpm build
            - run: pnpm exec wrangler deploy --dry-run
    browser:
        name: Browser tests ${{ matrix.name }}
        runs-on: ubuntu-latest
        timeout-minutes: 30
        strategy:
            fail-fast: false
            matrix:
                include:
                    - name: experience
                      args: --project=experience
                    - name: home
                      args: --project=home
                    - name: site-1
                      args: --project=site --shard=1/2
                    - name: site-2
                      args: --project=site --shard=2/2
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: 24.x
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - run: pnpm exec playwright install --with-deps chromium
            - run: pnpm test:e2e ${{ matrix.args }}
            - name: Upload browser report
              if: ${{ !cancelled() }}
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: playwright-report-worker-${{ matrix.name }}
                  path: playwright-report/
                  retention-days: 14
    browser-result:
        name: Browser tests against local Worker
        if: ${{ always() }}
        needs: browser
        runs-on: ubuntu-latest
        steps:
            - name: Require every browser shard to pass
              env:
                  BROWSER_RESULT: ${{ needs.browser.result }}
              run: test "$BROWSER_RESULT" = success
