name: E2E (Vercel preview)
permissions:
    contents: read

# Vercel reports each deployment to GitHub. When a Preview deployment
# succeeds, run the browser tests against its URL with real content. The
# result shows as a check on the deployed commit, so it appears on the PR.
# Weekly, the same tests run against the production site, because a
# content edit in Sanity makes no deployment.
on:
    deployment_status:
    schedule:
        - cron: "0 10 * * 1"

concurrency:
    group: ${{ github.workflow }}-${{ github.event.deployment.sha || github.ref }}
    cancel-in-progress: true

jobs:
    # Decides whether the tests can run. When they cannot, the test job is
    # skipped, so the check never passes having run nothing.
    gate:
        name: Preview test gate
        # Vercel's own successful Preview deployments (it creates them as
        # vercel[bot]), and the weekly run.
        if: >-
            github.event_name == 'schedule' ||
            (github.event.deployment_status.state == 'success' &&
            startsWith(github.event.deployment.environment, 'Preview') &&
            github.event.deployment.creator.login == 'vercel[bot]')
        runs-on: ubuntu-latest
        permissions:
            contents: read
            pull-requests: read
        outputs:
            enabled: ${{ steps.check.outputs.enabled }}
        steps:
            - name: Check for the protection-bypass secret and the commit's origin
              id: check
              env:
                  EVENT: ${{ github.event_name }}
                  SHA: ${{ github.event.deployment.sha }}
                  GH_TOKEN: ${{ github.token }}
                  VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
              run: |
                  # The production site is not protected: no secret needed.
                  if [ "$EVENT" = "schedule" ]; then
                      echo "enabled=true" >> "$GITHUB_OUTPUT"
                      exit 0
                  fi
                  if [ -z "$VERCEL_AUTOMATION_BYPASS_SECRET" ]; then
                      echo "enabled=false" >> "$GITHUB_OUTPUT"
                      echo "::notice title=Preview tests skipped::Add the VERCEL_AUTOMATION_BYPASS_SECRET repository secret to run the browser tests against protected Vercel previews."
                      echo "Preview tests skipped: the VERCEL_AUTOMATION_BYPASS_SECRET secret is not set." >> "$GITHUB_STEP_SUMMARY"
                      exit 0
                  fi
                  # The test step runs the deployed commit's code with the
                  # secret, so a fork's pull request never gets there.
                  forks=$(gh api "repos/$GITHUB_REPOSITORY/commits/$SHA/pulls" \
                      --jq "[.[] | select(.head.repo.full_name != \"$GITHUB_REPOSITORY\")] | length")
                  if [ "$forks" != "0" ]; then
                      echo "enabled=false" >> "$GITHUB_OUTPUT"
                      echo "::notice title=Preview tests skipped::The deployed commit is a fork's pull request, which never gets the protection-bypass secret."
                      echo "Preview tests skipped: the deployed commit is a fork's pull request." >> "$GITHUB_STEP_SUMMARY"
                      exit 0
                  fi
                  echo "enabled=true" >> "$GITHUB_OUTPUT"

    preview:
        name: Browser tests on ${{ github.event_name == 'schedule' && 'the production site' || 'the preview' }}
        needs: gate
        if: needs.gate.outputs.enabled == 'true'
        runs-on: ubuntu-latest
        timeout-minutes: 30
        env:
            BASE_URL: ${{ github.event_name == 'schedule' && 'https://adithya-rajendran.com' || github.event.deployment_status.environment_url || github.event.deployment_status.target_url }}

        # The protection-bypass secret is exposed only to the test run,
        # never to checkout, the dependency install or the Playwright
        # install (which runs apt), and never to the production run.
        # Note: on deployment_status, checkout gets the deployed commit, so
        # the test step runs that commit's code with the secret (the gate
        # keeps a fork's out); the secret only opens this project's
        # protected previews.
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            # pnpm version comes from package.json "packageManager".
            - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
            - name: Use Node.js 24.x
              uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
              with:
                  node-version: 24.x
                  cache: "pnpm"
            - run: pnpm install --frozen-lockfile
            - name: Install Chromium and its system libraries
              run: pnpm exec playwright install --with-deps chromium
            - name: Run the browser tests against ${{ env.BASE_URL }}
              env:
                  # Vercel → Project → Settings → Deployment Protection →
                  # Protection Bypass for Automation. Sent to the preview
                  # origin only (tests/e2e/support/test.ts).
                  VERCEL_AUTOMATION_BYPASS_SECRET: ${{ github.event_name != 'schedule' && secrets.VERCEL_AUTOMATION_BYPASS_SECRET || '' }}
              run: pnpm test:e2e:preview
            - name: Upload the report and screenshots
              if: ${{ !cancelled() }}
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: playwright-report-${{ github.event_name == 'schedule' && 'production' || 'preview' }}
                  path: playwright-report/
                  retention-days: 14
