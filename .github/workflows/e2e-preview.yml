name: E2E (Vercel preview)
permissions:
    contents: read

# Vercel reports each deployment to GitHub. When a Preview deployment
# succeeds, run the browser tests against its URL with real content. The
# result shows as a check on the deployed commit, so it appears on the PR.
on:
    deployment_status:

concurrency:
    group: ${{ github.workflow }}-${{ github.event.deployment.sha }}
    cancel-in-progress: true

jobs:
    preview:
        name: Browser tests on the preview
        if: >-
            github.event.deployment_status.state == 'success' &&
            startsWith(github.event.deployment.environment, 'Preview')
        runs-on: ubuntu-latest
        timeout-minutes: 30
        env:
            BASE_URL: ${{ github.event.deployment_status.environment_url || github.event.deployment_status.target_url }}
            # Vercel → Project → Settings → Deployment Protection →
            # Protection Bypass for Automation. Sent to the preview origin
            # only (tests/e2e/support/test.ts).
            VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}

        steps:
            - name: Check for the protection-bypass secret
              id: bypass
              run: |
                  if [ -n "$VERCEL_AUTOMATION_BYPASS_SECRET" ]; then
                      echo "enabled=true" >> "$GITHUB_OUTPUT"
                  else
                      echo "enabled=false" >> "$GITHUB_OUTPUT"
                      echo "::notice title=Preview tests skipped::Add the VERCEL_AUTOMATION_BYPASS_SECRET repository secret to run the browser tests against protected Vercel previews."
                      echo "Preview tests skipped: the VERCEL_AUTOMATION_BYPASS_SECRET secret is not set." >> "$GITHUB_STEP_SUMMARY"
                  fi
            - uses: actions/checkout@v7
              if: steps.bypass.outputs.enabled == 'true'
            # pnpm version comes from package.json "packageManager".
            - uses: pnpm/action-setup@v6
              if: steps.bypass.outputs.enabled == 'true'
            - name: Use Node.js 24.x
              if: steps.bypass.outputs.enabled == 'true'
              uses: actions/setup-node@v6
              with:
                  node-version: 24.x
                  cache: "pnpm"
            - if: steps.bypass.outputs.enabled == 'true'
              run: pnpm install --frozen-lockfile
            - name: Install Chromium and its system libraries
              if: steps.bypass.outputs.enabled == 'true'
              run: pnpm exec playwright install --with-deps chromium
            - name: Run the browser tests against ${{ env.BASE_URL }}
              if: steps.bypass.outputs.enabled == 'true'
              run: pnpm test:e2e:preview
            - name: Upload the report and screenshots
              if: ${{ !cancelled() && steps.bypass.outputs.enabled == 'true' }}
              uses: actions/upload-artifact@v7
              with:
                  name: playwright-report-preview
                  path: playwright-report/
                  retention-days: 14
