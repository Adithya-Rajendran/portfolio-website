version: 2
updates:
    - package-ecosystem: "npm"
      directory: "/"
      schedule:
          interval: "weekly"
          day: "monday"
      open-pull-requests-limit: 5
      ignore:
          # typescript-eslint does not support TypeScript 7 yet: with it the
          # dev-tooling group fails lint and holds back every update in it.
          - dependency-name: "typescript"
            versions: [">=7"]
      # A dependency goes to the first group that matches it, so the
      # packages that move in lockstep come before the catch-all types.
      groups:
          sanity:
              patterns:
                  - "sanity"
                  - "@sanity/*"
                  - "next-sanity"
          next:
              patterns:
                  - "next"
                  - "eslint-config-next"
          react:
              patterns:
                  - "react"
                  - "react-dom"
                  - "@types/react"
                  - "@types/react-dom"
          three:
              patterns:
                  - "three"
                  - "@types/three"
          tailwind:
              patterns:
                  - "tailwindcss"
                  - "@tailwindcss/postcss"
          playwright:
              patterns:
                  - "@playwright/test"
                  - "@axe-core/playwright"
          dev-tooling:
              patterns:
                  - "eslint*"
                  - "prettier"
                  - "typescript"
                  - "husky"
                  - "lint-staged"
                  - "vitest"
                  - "@vitest/*"
          types:
              patterns:
                  - "@types/*"

    - package-ecosystem: "github-actions"
      directory: "/"
      schedule:
          interval: "weekly"
          day: "monday"
