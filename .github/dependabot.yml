version: 2
updates:
    - package-ecosystem: "npm"
      directory: "/"
      schedule:
          interval: "weekly"
          day: "monday"
      open-pull-requests-limit: 5
      groups:
          types:
              patterns:
                  - "@types/*"
          sanity:
              patterns:
                  - "sanity"
                  - "@sanity/*"
                  - "next-sanity"
          next:
              patterns:
                  - "next"
                  - "eslint-config-next"
          react:
              patterns:
                  - "react"
                  - "react-dom"
                  - "@types/react"
                  - "@types/react-dom"
          radix:
              patterns:
                  - "@radix-ui/*"
          dev-tooling:
              patterns:
                  - "eslint*"
                  - "prettier"
                  - "typescript"
                  - "husky"
                  - "lint-staged"
                  - "vitest"
                  - "@vitest/*"
      ignore:
          # @types/node follows the Node major the site runs on
          # (engines.node, CI and Vercel: 24.x), so tsc rejects APIs that
          # would throw in production. Lift this when the engine moves.
          - dependency-name: "@types/node"
            update-types: ["version-update:semver-major"]

    - package-ecosystem: "github-actions"
      directory: "/"
      schedule:
          interval: "weekly"
          day: "monday"
